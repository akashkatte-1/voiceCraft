<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceCraft — Text to Audio Converter</title>
    <meta name="description" content="Convert text to natural-sounding speech with multiple voice options. Free, no sign-up required.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Animated background -->
    <div class="bg-effects">
        <div class="bg-grid"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
    </div>

    <!-- App Shell -->
    <div class="app-shell">

        <!-- Top Nav Bar -->
        <nav class="top-nav" id="top-nav">
            <div class="nav-left">
                <div class="logo-mark">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                        <rect width="28" height="28" rx="8" fill="url(#logo-grad)"/>
                        <path d="M8 10.5C8 10.5 10 12 10 14C10 16 8 17.5 8 17.5" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
                        <path d="M11.5 8.5C11.5 8.5 14 10.5 14 14C14 17.5 11.5 19.5 11.5 19.5" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
                        <path d="M15 6.5C15 6.5 18.5 9 18.5 14C18.5 19 15 21.5 15 21.5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
                        <path d="M18.5 8.5C18.5 8.5 21 10.5 21 14C21 17.5 18.5 19.5 18.5 19.5" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
                        <defs>
                            <linearGradient id="logo-grad" x1="0" y1="0" x2="28" y2="28">
                                <stop stop-color="#7c3aed"/>
                                <stop offset="1" stop-color="#4f46e5"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <span class="logo-text">VoiceCraft</span>
                <span class="badge">FREE</span>
            </div>
            <div class="nav-right">
                <div class="status-chip" id="nav-status">
                    <span class="status-dot"></span>
                    <span class="status-label">Ready</span>
                </div>
            </div>
        </nav>

        <!-- Main Two-Panel Layout -->
        <main class="main-layout" id="main-layout">

            <!-- ===== LEFT PANEL: Text Input ===== -->
            <section class="panel panel-left" id="panel-left">
                <div class="panel-header">
                    <h2 class="panel-title">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        Text Input
                    </h2>
                    <div class="panel-actions">
                        <button class="icon-btn" id="btn-paste" title="Paste from clipboard">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="2" width="8" height="4" rx="1" stroke="currentColor" stroke-width="2"/></svg>
                        </button>
                        <button class="icon-btn" id="btn-clear" title="Clear text">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                    </div>
                </div>

                <div class="textarea-wrap">
                    <textarea
                        id="text-input"
                        class="text-area"
                        placeholder="Start typing or paste your text here...

Example: &quot;Welcome to VoiceCraft, the free text-to-speech converter with multiple voices!&quot;"
                        maxlength="10000"
                        spellcheck="true"
                    ></textarea>
                    <div class="textarea-footer">
                        <span class="char-count" id="char-counter">0 characters</span>
                        <span class="word-count" id="word-counter">0 words</span>
                    </div>
                </div>

                <!-- Waveform Visualizer at bottom of left panel -->
                <div class="visualizer-strip" id="visualizer-strip">
                    <div class="visualizer-bars" id="visualizer-bars"></div>
                    <div class="visualizer-label" id="visualizer-label">Ready to speak</div>
                </div>
            </section>

            <!-- ===== RIGHT PANEL: Controls ===== -->
            <section class="panel panel-right" id="panel-right">

                <!-- Voice Selection -->
                <div class="control-block">
                    <div class="control-block-header">
                        <h3 class="control-title">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z" stroke="currentColor" stroke-width="2"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4m-3 0h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            Voice
                        </h3>
                        <span class="voice-badge" id="voice-count-badge">—</span>
                    </div>

                    <!-- Gender Filter Pills -->
                    <div class="gender-pills" id="gender-toggle">
                        <button class="pill active" data-gender="all" id="gender-all">All</button>
                        <button class="pill" data-gender="male" id="gender-male">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><circle cx="10" cy="14" r="6" stroke="currentColor" stroke-width="2"/><path d="M16.5 1.5h5m0 0v5m0-5l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            Male
                        </button>
                        <button class="pill" data-gender="female" id="gender-female">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="6" stroke="currentColor" stroke-width="2"/><path d="M12 15v6m-3-3h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                            Female
                        </button>
                    </div>

                    <!-- Voice Dropdown -->
                    <div class="select-wrap">
                        <select id="voice-select" class="custom-select">
                            <option value="">Loading voices...</option>
                        </select>
                        <svg class="select-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </div>
                </div>

                <!-- Sliders -->
                <div class="control-block">
                    <h3 class="control-title">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 21v-7m0 0a2 2 0 110-4 2 2 0 010 4zm8 7V11m0 0a2 2 0 110-4 2 2 0 010 4zm8 10v-3m0 0a2 2 0 110-4 2 2 0 010 4zM4 6V3m8 3V3m8 7V3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        Controls
                    </h3>

                    <!-- Speed -->
                    <div class="slider-group">
                        <div class="slider-header">
                            <label for="speed-range">Speed</label>
                            <span class="slider-val" id="speed-value">1.00x</span>
                        </div>
                        <input type="range" id="speed-range" class="styled-range" min="0.25" max="3" step="0.05" value="1">
                        <div class="slider-ticks"><span>0.25x</span><span>1x</span><span>3x</span></div>
                    </div>

                    <!-- Pitch -->
                    <div class="slider-group">
                        <div class="slider-header">
                            <label for="pitch-range">Pitch</label>
                            <span class="slider-val" id="pitch-value">1.0</span>
                        </div>
                        <input type="range" id="pitch-range" class="styled-range" min="0" max="2" step="0.1" value="1">
                        <div class="slider-ticks"><span>Low</span><span>Normal</span><span>High</span></div>
                    </div>

                    <!-- Volume -->
                    <div class="slider-group">
                        <div class="slider-header">
                            <label for="volume-range">Volume</label>
                            <span class="slider-val" id="volume-value">100%</span>
                        </div>
                        <input type="range" id="volume-range" class="styled-range" min="0" max="1" step="0.05" value="1">
                        <div class="slider-ticks"><span>Mute</span><span>50%</span><span>Max</span></div>
                    </div>
                </div>

                <!-- Playback Buttons -->
                <div class="control-block playback-block">
                    <div class="playback-row">
                        <button class="play-btn" id="btn-speak" title="Speak">
                            <svg class="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5 3l14 9-14 9V3z" fill="currentColor"/></svg>
                            <svg class="icon-pause hidden" width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/></svg>
                            <span id="btn-play-label">Speak</span>
                        </button>
                    </div>
                    <div class="secondary-btns">
                        <button class="sec-btn" id="btn-preview" title="Preview first 20 words">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15.54 8.46a5 5 0 010 7.07M18.36 5.64a9 9 0 010 12.73M8 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h4l5-5v16l-5-5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            Preview
                        </button>
                        <button class="sec-btn" id="btn-stop" title="Stop speaking">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="2" fill="currentColor"/></svg>
                            Stop
                        </button>
                    </div>

                    <!-- Progress -->
                    <div class="progress-wrap hidden" id="progress-wrap">
                        <div class="progress-track">
                            <div class="progress-fill" id="progress-fill"></div>
                        </div>
                        <span class="progress-label" id="progress-label">Speaking...</span>
                    </div>
                </div>

            </section>
        </main>

        <!-- Bottom Bar -->
        <footer class="bottom-bar">
            <span>Powered by Web Speech API</span>
            <span class="separator">•</span>
            <span>Best in Chrome, Edge & Safari</span>
        </footer>
    </div>

    <!-- Toast container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
